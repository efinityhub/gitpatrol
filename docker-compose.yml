services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend/data:/app/data
      - ./backend/db:/app/db
    environment:
      - DB_PATH=./db/gitpatrol.db
      - LOG_RETENTION_DAYS=7
      - LOG_MAX_ROWS=10000

  frontend:
    build: ./frontend
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - backend
